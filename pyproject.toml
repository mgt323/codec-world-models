[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codec-world-models"
version = "0.1.0"
description = "Controlled experiment: observation codecs and learnable world models"
requires-python = "==3.13.15"
dependencies = [
    "torch",
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy",
    "pandas",
    "h5py",
    "pyarrow",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest",
]
# Optional analysis extras. Not imported by world/, obs_codecs/, data/, model/, or train/.
analysis = [
    "scipy",
    "matplotlib",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
triton-rocm = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.setuptools.packages.find]
include = [
    "configs*",
    "data*",
    "eval*",
    "model*",
    "obs_codecs*",
    "probes*",
    "train*",
    "world*",
]
exclude = [
    "artifacts*",
    "tests*",
    "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: real artifacts / full packer→model pipeline checks",
]
