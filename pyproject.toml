[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codec-world-models"
version = "0.1.0"
description = "Controlled experiment: observation codecs and learnable world models"
requires-python = "==3.13.15"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pydantic",
    "zarr",
    "h5py",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = [
    "configs*",
    "data*",
    "eval*",
    "obs_codecs*",
    "world*",
]
exclude = [
    "artifacts*",
    "tests*",
    "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
